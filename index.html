<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>GameOn</title>
  </head>
  <body>
    <div class="menu-container">
      <h1 class="game-title">Rubert's Adventure</h1>

      <div class="slider-container">
        <label for="music-volume">Music Volume</label>
        <input type="range" id="music-volume" min="0" max="100" value="50" />
      </div>

      <div class="slider-container">
        <label for="sfc-volume">Sfx Volume</label>
        <input type="range" id="sfx-volume" min="0" max="100" value="50" />
      </div>

      <button class="play-button" onclick="startGame()">Play</button>
    </div>
    <div class="game-over-container">
      <h1 class="game-over-title">Game Over</h1>
      <button class="retry-button" onclick="restartGame()">Retry</button>
      <button class="menu-button" onclick="mainMenu()">Main Menu</button>
    </div>
    <div id="canvas-div"><canvas width="1500" height="700"></canvas></div>
    <script src="./js/portals.js"></script>
    <script src="./js/gameobject.js"></script>
    <script src="./js/spikes.js"></script>
    <script src="./js/buttons.js"></script>
    <script src="./js/linkedobjects.js"></script>
    <script src="./js/tiles.js"></script>
    <script src="./js/images.js"></script>
    <script src="./js/audioloader.js"></script>
    <script src="./js/player.js"></script>
    <script src="./js/controls.js"></script>
    <script src="./js/engine.js"></script>
    <script src="./js/levels.js"></script>
    <script src="./js/index.js"></script>
  </body>
</html>
