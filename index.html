<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>GameOn</title>
  </head>
  <body>
    <div class="main-container">
      <div class="menu-container">
        <h1 class="game-title">Crystal Adventure</h1>

        <div class="slider-container">
          <label for="music-volume">Music Volume</label>
          <input type="range" id="music-volume" min="0" max="100" value="50" />
        </div>

        <div class="slider-container">
          <label for="sfc-volume">Sfx Volume</label>
          <input type="range" id="sfx-volume" min="0" max="100" value="50" />
        </div>

        <button class="play-button" onclick="startGame()">Play</button>
      </div>
      <div class="win-container">
        <h1 class="win-title">You won!</h1>
        <button class="menu-button" onclick="mainMenu()">Main Menu</button>
      </div>
      <div class="game-over-container">
        <h1 class="game-over-title">Game Over</h1>
        <button class="menu-button" onclick="restartGame()">Retry</button>
        <button class="menu-button" onclick="mainMenu()">Main Menu</button>
      </div>
    </div>
    <div id="canvas-div">
      <canvas width="1200" height="700"></canvas>
      <div>
        <img
          id="movement"
          src="./assets/movement.png"
          alt="Movement keybinds"
        />
        <img
          id="worldjump"
          src="./assets/worldjump.png"
          alt="Worldjumping keybind"
        />
      </div>
    </div>
    <script src="./classes/cutscene.js"></script>
    <script src="./classes/gameobject.js"></script>
    <script src="./classes/parallax.js"></script>
    <script src="./classes/portals.js"></script>
    <script src="./classes/spikes.js"></script>
    <script src="./classes/buttons.js"></script>
    <script src="./classes/linkedobjects.js"></script>
    <script src="./classes/tiles.js"></script>
    <script src="./classes/images.js"></script>
    <script src="./classes/audioloader.js"></script>
    <script src="./classes/player.js"></script>
    <script src="./classes/controls.js"></script>
    <script src="./classes/engine.js"></script>
    <script src="./classes/levels.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
